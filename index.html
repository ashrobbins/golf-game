<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v2.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16-v2.png" />
    <!-- Filename is versioned (-v2), not just the file content, deliberately —
         iOS caches a home-screen "Add to Home Screen" icon against the exact
         URL it first fetched and won't re-check it on its own. Changing the
         URL is what makes an already-installed icon actually update; bump
         this suffix again (v3, v4, ...) for any future icon change, rather
         than overwriting the v2 file in place. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b4fe8" />
    <!-- iOS ignores the manifest's display:standalone unless told directly
         to run "Add to Home Screen" as a standalone app rather than just
         opening Safari with the URL bar showing. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Beating Bogey" />
    <title>Beating Bogey</title>
    <!-- Cloudflare Web Analytics — pageviews/visits only, no cookies, no
         custom event support. Registered against golf-game-azure.vercel.app. -->
    <script
      type="module"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "f90d2eafef0840499c38c0940e1e6661"}'
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
